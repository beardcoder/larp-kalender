<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15110e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": since iOS 26 the system draws a blur over the top ~40pt of a home screen
         app that extends under the status bar, which made the header look out of focus. The bar takes the theme colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LARP-Kalender" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("lk.theme") || '"auto"');
        if (t !== "auto") document.documentElement.dataset.theme = t;
        var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#15110e" : "#f5efe6");
      } catch (e) {}
    </script>
    <!--assets-->
    <!--meta-->
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding:24px">Der LARP-Kalender braucht JavaScript. Alternativ: <a href="/veranstaltungen.csv">Termine als CSV</a> oder <a href="/kalender.ics">als Kalender</a>.</p></noscript>
  </body>
</html>
